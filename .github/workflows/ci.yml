name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # build (tokens, components.css, dist/react via tsc) + contrast + Figma parity + token rules
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Committed build output is up to date
        run: git diff --exit-code -- dist src/react/icon/icons.ts
      - name: Showcase site builds
        run: |
          npm --prefix site ci
          npm --prefix site run build
