name: No Claude co-author trailers

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Claude co-author trailers
        # Scans every commit reachable from the checked-out head. This also
        # works after force-pushes, where the pre-push SHA no longer exists.
        run: |
          set -euo pipefail
          if git log --format=%B HEAD | grep -iE 'co-authored-by:.*claude'; then
            echo "::error::Found a 'Co-Authored-By: Claude' trailer in a commit message. Remove it (amend or rewrite the commit message) and push again."
            exit 1
          fi
          echo "No Claude co-author trailers found."
